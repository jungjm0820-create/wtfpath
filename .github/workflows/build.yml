name: Build Motion Sculpt C++ Core

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'  # Blender 내장 파이썬 버전 (Blender 4.x/5.x 사양에 맞춤)

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pybind11

    - name: Check pybind11 Directory
      shell: pwsh
      run: |
        $pybind_dir = python -m pybind11 --cmakedir
        Write-Host "pybind11 CMake Dir: $pybind_dir"

    - name: Configure CMake
      shell: pwsh
      run: |
        $pybind_dir = python -m pybind11 --cmakedir
        cmake -S cpp -B build -Dpybind11_DIR="$pybind_dir"

    - name: Build C++ Module
      run: |
        cmake --build build --config Release --verbose

    - name: List Output Files
      shell: pwsh
      run: |
        Get-ChildItem -Path build -Recurse -Filter "*.pyd"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: motion_core_cpp-windows-py311
        path: |
          build/Release/*.pyd
          build/*.pyd
