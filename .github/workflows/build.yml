name: Build Motion Sculpt C++ Core

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'  # 사용 중인 블렌더 내장 파이썬 버전에 맞춰 설정

    - name: Install pybind11 & CMake
      run: |
        python -m pip install --upgrade pip
        pip install pybind11

    - name: Build C++ Module with CMake
      run: |
        mkdir build
        cd build
        cmake ../cpp
        cmake --build . --config Release

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: motion_core_cpp
        path: |
          build/Release/*.pyd
          build/*.pyd
